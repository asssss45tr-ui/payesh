name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Add API key
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> local.properties
      - name: Build
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace > build.log 2>&1
          code=$?
          grep -nE "error:|e: |What went wrong|FAILURE|not found|SDK location" -A4 build.log | head -60
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: payesh-apk
          path: app/build/outputs/apk/debug/*.apk
